#################
### TEMPLATES ###
#################

# template for documentation
.doc_template: &doc_template
  when: always
  stage: doc
  needs: []
  script:
    - module purge
    - module load GCC/13.3.0 texlive/20250308
    - module use /global/apps/modulefiles
    - module load chs-fortran-conda/0.6.0
    - export PROJECT_NUMBER="$(cat version.txt)"
    - doxygen doc/doxygen.config > doxygen_log.txt 2>&1
    - |
      printf 'Building PDF with Tectonic...\n'
      if ! (
        cd latex &&
        tectonic -X compile --keep-intermediates --keep-logs refman.tex &&
        makeindex refman.idx &&
        tectonic -X compile --keep-intermediates --keep-logs refman.tex
      ) > "doxygen_latex.txt" 2>&1; then
        tail -n 80 "doxygen_latex.txt"
        exit 1
      fi
    - cp latex/refman.pdf forces_doc.pdf
  artifacts:
    when: always
    expose_as: "Documentation HTML and PDF"
    name: "$CI_COMMIT_REF_NAME"
    paths:
      - html/
      - forces_doc.pdf
      - doxygen_log.txt
      - doxygen_warn.txt
      - doxygen_latex.txt

# Coverage reports remain job artifacts, independent of documentation publishing.
.coverage_template: &coverage_template
  when: always
  stage: test
  needs: []
  script:
    - module purge
    - module use /global/apps/modulefiles
    - module load chs-fortran-conda/0.6.0
    - cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Debug -DFORCES_BUILD_TESTING=ON -DFORCES_WITH_COVERAGE=ON -DFORCES_WITH_OpenMP=OFF $COVERAGE_FLAGS
    - cmake --build "$BUILD_DIR" --parallel 4
    - cmake --build "$BUILD_DIR" --target coverage
    # Strip logical and physical checkout prefixes before converting for GitLab.
    - |
      mkdir -p coverage
      cp -a "$BUILD_DIR/coverage/." coverage/
      lcov --rc check_data_consistency=0 --add-tracefile "$BUILD_DIR/coverage.info" \
        --substitute "s#^(\Q$PWD\E|\Q$(pwd -P)\E)/##" --output-file coverage/coverage.info
      lcov_cobertura coverage/coverage.info --base-dir . --output coverage/coverage.xml
  coverage: '/lines[\.]+\: (\d+\.\d+)\%/'
  artifacts: &coverage_artifacts
    when: always
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    paths:
      - coverage/
      - $BUILD_DIR/Testing/Temporary/LastTest.log

# template for test jobs
.job_template: &job_template
  stage: test
  script:
    - source $MODULE_LOAD_SCRIPT
    - cmake -B $BUILD_DIR $CMAKE_FLAGS
    - cmake --build $BUILD_DIR --parallel 4
    - cmake --build $BUILD_DIR --parallel 4 --target $BUILD_TARGET
    - $POST_RUN_CMD
  artifacts:
    when: always
    paths:
    - $BUILD_DIR/$ARTIFACT_PATH

# template for OpenMP test jobs
.omp_job_template: &omp_job_template
  <<: *job_template
  stage: openmp

# template for example jobs
.examples_template: &examples_template
  stage: examples
  script:
    - source $MODULE_LOAD_SCRIPT
    - EXAMPLE_FILES="$(find examples -type f -name '*.f90' | sort)"
    - |
      if [ -z "$EXAMPLE_FILES" ]; then
        echo "FORCES: no Fortran examples found under examples/"
        exit 1
      fi
    - |
      for example in $EXAMPLE_FILES; do
        echo "FORCES: building and running example ${example}"
        cmake -B "$BUILD_DIR" $CMAKE_FLAGS -DFORCES_EXE="$example"
        cmake --build "$BUILD_DIR" --parallel 4
        ./$BUILD_DIR/main
      done

