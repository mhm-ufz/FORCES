pages:
  only:
    - main
  stage: deploy
  needs:
    - job: documentation
      artifacts: true
  script:
    # Publish the main branch documentation at the Pages root.
    - rm -rf public
    - cp -a html public
  artifacts:
    name: "$CI_COMMIT_REF_NAME"
    paths:
      - public
